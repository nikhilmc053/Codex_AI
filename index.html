<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Quality Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Food quality helper</p>
        <h1 id="page-title">Is this food junk?</h1>
        <p class="intro">
          Add a short description of a food item and explain how it is made. On
          submission, the checker looks for common nutrition clues and shows
          whether the food appears to be junk food or not.
        </p>
      </section>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Describe the food</h2>
        <form id="food-form" novalidate>
          <label for="food-name">Food item</label>
          <input
            id="food-name"
            name="foodName"
            type="text"
            placeholder="e.g. Veggie burger, apple slices, fries"
            required
          />

          <label for="food-description">Short description</label>
          <textarea
            id="food-description"
            name="foodDescription"
            rows="4"
            placeholder="Describe the main ingredients, taste, or portion size."
            required
          ></textarea>

          <label for="food-preparation">How it is made</label>
          <textarea
            id="food-preparation"
            name="foodPreparation"
            rows="4"
            placeholder="Explain whether it is baked, fried, grilled, fresh, processed, etc."
            required
          ></textarea>

          <button type="submit">Check food</button>
        </form>
      </section>

      <section id="result" class="result hidden" aria-live="polite"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
